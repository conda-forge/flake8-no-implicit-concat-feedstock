schema_version: 1

context:
  name: flake8-no-implicit-concat
  version: "0.3.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 13e812a14c56bfd2e007552d6cd1a12843d591455f046c1a1a5911003e188479

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=80
    - wheel
    - setuptools-scm >=8.0
    # From setuptools_scm[toml]
    - tomli
  run:
    - python >=${{ python_min }}
    - flake8

tests:
  - python:
      imports:
        - flake8_no_implicit_concat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - flake8
        - pip
        - if: win
          then: m2-grep
        - python ${{ python_min }}.*
    script:
      - flake8 --version | grep no-implicit-concat

about:
  summary: Flake8 plugin that forbids implicit str/bytes literal concatenations
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/10sr/flake8-no-implicit-concat

extra:
  recipe-maintainers:
    - thewchan
